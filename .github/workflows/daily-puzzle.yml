name: Daily Coding Puzzle


on:
  schedule:schedule:
    - cron: "7 3 * * *"
    - cron: "7 15 * * *"
  workflow_dispatch:
    inputs:
      part:
        description: "Which part to send"
        type: choice
        options: [morning, evening]
        default: morning

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide morning or evening
        id: part
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "part=${{ inputs.part }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 15 * * *" ]; then
            echo "part=evening" >> "$GITHUB_OUTPUT"
          else
            echo "part=morning" >> "$GITHUB_OUTPUT"
          fi
      - name: Send puzzle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          GREENAPI_ID: ${{ secrets.GREENAPI_ID }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          GREENAPI_URL: ${{ secrets.GREENAPI_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-oss-120b' }}
        run: python puzzle.py --${{ steps.part.outputs.part }}
      - name: Save state
        run: |
          git config user.name "daily-drip-bot"
          git config user.email "daily-drip-bot@users.noreply.github.com"
          git add puzzle_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Daily puzzle: ${{ steps.part.outputs.part }}"
          git pull --rebase && git push
