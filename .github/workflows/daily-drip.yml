on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and send today's lesson
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          GREENAPI_ID: ${{ secrets.GREENAPI_ID }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          GREENAPI_URL: ${{ secrets.GREENAPI_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRIP_MODE: ${{ vars.DRIP_MODE || 'mix' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-oss-120b' }}
        run: python drip.py
      - name: Save progress
        run: |
          git config user.name "daily-drip-bot"
          git config user.email "daily-drip-bot@users.noreply.github.com"
          git add progress.json
          git diff --cached --quiet || git commit -m "Daily drip: progress update"
          git pull --rebase && git push
